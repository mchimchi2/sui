<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><title>審査コメント デモ</title>
<style>
@font-face { font-family:"SR"; font-weight:900; src: local("Noto Serif CJK JP Black"); }
@font-face { font-family:"SS"; font-weight:700; src: local("Noto Sans CJK JP Bold"); }
@font-face { font-family:"SS"; font-weight:900; src: local("Noto Sans CJK JP Black"); }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:linear-gradient(to bottom,#12263d 0%,#35577a 30%,#e9b98a 47%,#f2c48d 49%,#2a5d7c 50%,#123049 75%,#0b1a2a 100%)}
.chip{position:absolute;left:48px;top:64px;font-family:SS;font-size:26px;font-weight:700;color:#0b1a2a;background:rgba(245,239,228,.92);padding:10px 22px;border-radius:40px}
#judge{position:absolute;left:250px;top:1080px;width:580px;height:580px;border-radius:50%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);transform-origin:50% 100%}
#judge img{position:absolute;inset:0;width:100%;height:100%;visibility:hidden}
#judge img.on{visibility:visible}
#bubble{position:absolute;left:80px;top:560px;width:920px;background:#fffaf0;color:#1b2533;border-radius:48px;padding:56px 60px;font-family:SS;font-weight:900;font-size:72px;line-height:1.35;box-shadow:0 12px 40px rgba(0,0,0,.3);transform-origin:60% 100%}
#bubble:after{content:"";position:absolute;left:470px;bottom:-60px;border:40px solid transparent;border-top:60px solid #fffaf0}
#name{position:absolute;left:0;width:1080px;top:1700px;text-align:center;font-family:SS;font-weight:900;font-size:44px;color:#fff;letter-spacing:6px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
</style></head><body>
<div class="chip">未宿泊・公式情報より</div>
<div id="bubble"><span id="txt"></span></div>
<div id="judge">
  <img id="m0" class="on" src="../../assets/character/mouth_0.png"><img id="m1" src="../../assets/character/mouth_1.png"><img id="m2" src="../../assets/character/mouth_2.png">
</div>
<div id="name">ちび審査員</div>
<script>
// 台詞(実際はナレーション音声の長さに合わせる)。文字送り中だけ口パク 0→1→2→1…
const line = "お部屋で海を見ながら<br>おふろ…?<br>それは、ずるいでちゅ。";
const chars = line.split(/(<br>)/).flatMap(p => p === "<br>" ? [p] : [...p]);
const cps = 11;
const seq = [0,1,2,1];
// 書き出し時は window.seek(t) でフレーム単位に描画する(決定的)
function draw(t){
  const n = Math.min(chars.length, Math.floor(Math.max(0,t-0.4)*cps));
  document.getElementById("txt").innerHTML = chars.slice(0,n).join("");
  const talking = t>0.4 && n < chars.length;
  const m = talking ? seq[Math.floor(t*12)%4] : 0;
  for (const k of [0,1,2]) document.getElementById("m"+k).classList.toggle("on", k===m);
  const b = document.getElementById("judge");
  b.style.transform = `scale(${t<0.35 ? 0.6+t*1.3 : 1}) rotate(${talking?Math.sin(t*9)*2:0}deg)`;
  document.getElementById("bubble").style.transform = `scale(${t<0.5?Math.min(1,t*2.4):1})`;
}
window.seek = draw;
if (!location.search.includes("export")) { const t0=performance.now(); const loop=n=>{draw((n-t0)/1000);requestAnimationFrame(loop)}; requestAnimationFrame(loop); }
</script></body></html>
